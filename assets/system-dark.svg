    <rect x="66" y="181" width="2" height="56" fill="#c9a96a"/>
    <text x="88" y="209" class="ink sans" font-size="28" font-weight="650" letter-spacing=".3">Ariel López García</text>
    <text x="88" y="232" class="muted" font-size="11" letter-spacing="2.6">OBSERVER · BUILDER · PERMANENT LEARNER</text>

    <text x="66" y="280" class="value sans" font-size="16">
      <tspan x="66" dy="0">I like understanding systems from first principles,</tspan>
      <tspan x="66" dy="25">building things, and learning deeply</tspan>
      <tspan x="66" dy="25">across disciplines.</tspan>
    </text>

    <text x="66" y="386" class="cyan" font-size="15">&gt; ./ariel --info</text>
    <g font-size="14">
      <text x="66" y="426" class="key">default_mode</text><text x="258" y="426" class="value">curious</text>
      <text x="66" y="454" class="key">complexity</text><text x="258" y="454" class="value">decompose()</text>
