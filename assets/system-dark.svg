<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">ARIEL RESEARCH SYSTEM</title>
  <desc id="desc">A dark scientific terminal-style profile with an animated universe of questions for Ariel López García.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090e"/>
      <stop offset="0.55" stop-color="#0b1017"/>
      <stop offset="1" stop-color="#080b11"/>
    </linearGradient>
    <radialGradient id="halo" cx="78%" cy="17%" r="62%">
      <stop offset="0" stop-color="#5cc8bd" stop-opacity=".12"/>
      <stop offset=".42" stop-color="#5cc8bd" stop-opacity=".025"/>
      <stop offset="1" stop-color="#5cc8bd" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#91a4b8" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="star-glow" x="-180%" y="-180%" width="460%" height="460%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="count-window"><rect x="264" y="336" width="36" height="16"/></clipPath>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
      .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
      .muted{fill:#718092}.ink{fill:#e8edf2}.cyan{fill:#70d2c6}.gold{fill:#c9a96a}
      .key{fill:#8795a5}.value{fill:#dce4eb}
      .pulse{animation:pulse 3.4s ease-in-out infinite;transform-origin:1058px 69px}
      .cursor{animation:blink 1.2s steps(1,end) infinite}
      .field-star{transform-box:fill-box;transform-origin:center;animation:star-twinkle 6.2s ease-in-out infinite}
      .field-star:nth-child(3n+1){animation-delay:-1.8s}.field-star:nth-child(3n+2){animation-delay:-4.1s}
      .question-particle{transform-box:fill-box;transform-origin:center;animation:question-cross var(--period) linear var(--delay) infinite}
      .question-node{filter:url(#star-glow)}
      .question-link{transform-box:fill-box;transform-origin:center bottom;opacity:0;animation:connection-inside var(--period) linear var(--event-delay) infinite}
      .entry-mark{transform-box:fill-box;transform-origin:center;opacity:0;animation:entry-detected var(--period) ease-out var(--event-delay) infinite}
      .const-ripple{transform-box:fill-box;transform-origin:center;animation:ripple 2.8s ease-out infinite}
      .counter-units{animation:counter-roll 10s steps(10,end) infinite}
      .counter-tens{animation:counter-roll 100s steps(10,end) -1s infinite}
      .counter-hundreds{animation:counter-roll 1000s steps(10,end) -1s infinite}
      @keyframes pulse{0%,100%{opacity:.48;transform:scale(.82)}50%{opacity:1;transform:scale(1.12)}}
      @keyframes blink{0%,48%{opacity:1}49%,100%{opacity:0}}
      @keyframes star-twinkle{0%,100%{opacity:.24;transform:scale(.8)}50%{opacity:.82;transform:scale(1.18)}}
      @keyframes question-cross{0%{opacity:0;transform:translateY(0)}8%{opacity:.32;transform:translateY(20px)}31%{opacity:1;transform:translateY(77.5px)}48%{opacity:.46;transform:translateY(120px) scale(.86)}52%{opacity:.46;transform:translateY(130px) scale(.86)}69%{opacity:1;transform:translateY(172.5px)}92%{opacity:.3;transform:translateY(230px)}100%{opacity:0;transform:translateY(250px)}}
      @keyframes connection-inside{0%,30.9%{opacity:0;transform:scaleY(.376)}31%{opacity:.42;transform:scaleY(.376)}48%,52%{opacity:.28;transform:scaleY(0)}69%{opacity:.38;transform:scaleY(-.376)}69.1%,100%{opacity:0;transform:scaleY(-.376)}}
      @keyframes entry-detected{0%,30.9%{opacity:0;transform:scale(.65)}31%{opacity:.76;transform:scale(.78)}34%,100%{opacity:0;transform:scale(1.85)}}
      @keyframes ripple{0%{opacity:.8;transform:scale(.55)}80%,100%{opacity:0;transform:scale(1.38)}}
      @keyframes counter-roll{to{transform:translateY(-140px)}}
      @media (prefers-reduced-motion:reduce){.pulse,.cursor,.field-star,.question-particle,.question-link,.entry-mark,.const-ripple,.counter-units,.counter-tens,.counter-hundreds{animation:none}.cursor{opacity:1}.field-star{opacity:.5}.question-particle{opacity:.78}.question-link,.entry-mark{opacity:0}.const-ripple{opacity:.45}}
    </style>
  </defs>

